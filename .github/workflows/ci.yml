name: CI

# PR-time checks. Deployment is handled separately by deploy.yml, which runs
# on every push to main; this workflow never deploys.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The bundled reference tables must be exactly what the toyomacro pin
      # produces (fails otherwise). A newer toyomacro release that changed
      # them only produces a warning annotation; see scripts/check-toyomacro-pin.py.
      - name: Check reference-data pin
        run: npm run data:check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
